name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m conformance.run
      - run: olp-lite demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m venv /tmp/openline-clean
      - run: /tmp/openline-clean/bin/pip install dist/*.whl
      - run: cd /tmp && /tmp/openline-clean/bin/olp-lite demo
      - run: cd /tmp && /tmp/openline-clean/bin/olp-lite benchmark --depths 1,2,4 --iterations 2 --out /tmp/wheel-benchmark.json

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[benchmark]'
      - run: olp-lite benchmark --depths 1,2,4,8,16,32 --iterations 20 --tokenizer tiktoken:cl100k_base --out benchmark-cl100k.json
      - run: python -c "import json; p=json.load(open('benchmark-cl100k.json')); assert p['combined_score'] is None; assert p['decision_quality']['openline_lite_correct']==9; assert p['break_even']['one_handoff_first_tested_depth']==2; assert p['break_even']['cumulative_first_tested_depth']==4"
      - uses: actions/upload-artifact@v4
        with:
          name: openline-lite-benchmark-cl100k
          path: benchmark-cl100k.json
