name: OLP low-cost capacity canary — exact tag only

on:
  push:
    tags:
      - "RUN_LOW_COST_CAPACITY_CANARY_ONLY_RETRY1"

permissions:
  contents: read

concurrency:
  group: olp-low-cost-capacity-canary
  cancel-in-progress: false

env:
  CANARY_TAG: RUN_LOW_COST_CAPACITY_CANARY_ONLY_RETRY1

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require exact one-shot canary tag
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${CANARY_TAG}"
      - name: Verify canary package before live requests
        run: python -m unittest discover -s experiments/paired-mechanism-capacity-canary/tests -p 'test_*.py' -v
      - name: Run representative token-capacity canary; no retries
        run: python experiments/paired-mechanism-capacity-canary/canary.py --out build/CAPACITY_CANARY_RECEIPT.json
      - name: Upload canary receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olp-low-cost-capacity-canary-receipt
          path: |
            build/CAPACITY_CANARY_RECEIPT.json
            build/CAPACITY_CANARY_RECEIPT.json.sha256
          if-no-files-found: error
          retention-days: 90
