name: OLP 30-pair 003 real execution — exact tag only

on:
  push:
    tags:
      - "RUN_REAL_OLP_CORE21_PAIRED_MECHANISM_003"

permissions:
  contents: read
  actions: read

concurrency:
  group: olp-core21-paired-mechanism-003-real-assignment
  cancel-in-progress: false

env:
  EXEC_ROOT: experiments/paired-mechanism-003
  REAL_RUN_TAG: RUN_REAL_OLP_CORE21_PAIRED_MECHANISM_003
  PUBLICATION_COMMITMENT_SHA256: e90ea4e48eb76e350a3ddc2888e2d164f8b29634b7473a65a3a798c1fda02283
  SCORER_FREEZE_SHA256: 47839b052d496461e5a613cf268f9d4e85c41ea948ed9c7d95b528a9939e2e6e

jobs:
  pre_run_003:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      preflight_sha256: ${{ steps.preflight_sha.outputs.sha256 }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require exact 003 trigger tag
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "push"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "${GITHUB_REF}" = "refs/tags/${REAL_RUN_TAG}"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Verify no prior 003 assignment attempt
        run: python "$EXEC_ROOT/guard_once.py"
      - name: Re-run exact frozen 003 preflight immediately before assignment
        run: python "$EXEC_ROOT/preflight_003.py" --out "$EXEC_ROOT/build/PREFLIGHT_003_PASS.json"
      - name: Bind preflight receipt SHA to this run
        id: preflight_sha
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$EXEC_ROOT/build/PREFLIGHT_003_PASS.json" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
      - name: Upload pre-assignment 003 preflight receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-pre-run-preflight
          path: |
            ${{ env.EXEC_ROOT }}/build/PREFLIGHT_003_*.json
            ${{ env.EXEC_ROOT }}/build/PREFLIGHT_003_*.json.sha256
          if-no-files-found: error
          retention-days: 90

  validate-protected-secret:
    needs: pre_run_003
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate dedicated 003 protected secret before any assignment attempt
        shell: bash
        env:
          OLP_003_KEY_DERIVATION_SECRET: ${{ secrets.OLP_003_KEY_DERIVATION_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PYSECRET'
          import os
          import re
          name = "OLP_003_KEY_DERIVATION_SECRET"
          value = os.environ.pop(name, None)
          if value is None or re.fullmatch(r"[0-9A-Fa-f]{64}", value) is None:
              raise SystemExit("protected 003 key derivation secret is missing or malformed")
          if value == "0" * 64:
              raise SystemExit("protected 003 key derivation secret cannot be all zero")
          print("PROTECTED_003_KEY_DERIVATION_SECRET_FORMAT_PASS")
          PYSECRET

  assign-once:
    needs: [pre_run_003, validate-protected-secret]
    if: github.run_attempt == 1 && needs.pre_run_003.result == 'success' && needs.validate-protected-secret.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Generate fresh 003 blinded assignment exactly once
        shell: bash
        env:
          OLP_003_KEY_DERIVATION_SECRET: ${{ secrets.OLP_003_KEY_DERIVATION_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          mkdir -p "$EXEC_ROOT/build/assignment/public" "$EXEC_ROOT/build/assignment/sealed"
          RM_SHA=$(sha256sum "$EXEC_ROOT/RUNNER_MANIFEST.json" | awk '{print $1}')
          python "$EXEC_ROOT/assignment.py" \
            --pair-set "$EXEC_ROOT/frozen_scientific/PAIR_SET_FROZEN.json" \
            --public-dir "$EXEC_ROOT/build/assignment/public" \
            --sealed-dir "$EXEC_ROOT/build/assignment/sealed" \
            --key-derivation-secret-env OLP_003_KEY_DERIVATION_SECRET \
            --key-context "${GITHUB_REPOSITORY}@${GITHUB_SHA}#${GITHUB_RUN_ID}" \
            --design-sha256 fd0b9eb2e2f494031bac8448dba3f6344071a4d8f2ea9285d2c3fd8ecc159f7f \
            --pair-set-sha256 5c622e0deaf500f7f39d9c5afece7550c1fa4859155d8b7191eb67bb0a725533 \
            --signal-schema-sha256 88dbb498881e84e32b7599ec2ec1bf186a923bc17d7e0c67c4d09cf2b9cddb8d \
            --perturbation-sha256 1a94515d691b86719b17885c3bf983fbe7d052affebc22406ec35b34fc9bc9e4 \
            --preflight-pass-sha256 "${{ needs.pre_run_003.outputs.preflight_sha256 }}" \
            --runner-manifest-sha256 "$RM_SHA" \
            --publication-commitment-sha256 "$PUBLICATION_COMMITMENT_SHA256" \
            --scorer-freeze-sha256 "$SCORER_FREEZE_SHA256"
      - name: Persist 003 assignment lock first
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-assignment-lock
          path: |
            ${{ env.EXEC_ROOT }}/build/assignment/public/blinded_run_manifest.json
            ${{ env.EXEC_ROOT }}/build/assignment/public/ASSIGNMENT_LOCK.json
          if-no-files-found: error
          retention-days: 90
      - name: Persist 003 sealed condition material
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-sealed-condition-material
          path: ${{ env.EXEC_ROOT }}/build/assignment/sealed/SEALED_CONDITION_BUNDLE.zip
          if-no-files-found: error
          retention-days: 90
  execute-pairs:
    needs: assign-once
    if: github.run_attempt == 1 && needs.assign-once.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pair_id: [P01,P02,P03,P04,P05,P06,P07,P08,P09,P10,P11,P12,P13,P14,P15,P16,P17,P18,P19,P20,P21,P22,P23,P24,P25,P26,P27,P28,P29,P30]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-assignment-lock
          path: private/public-assignment
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-sealed-condition-material
          path: private/sealed
      - name: Execute opaque 003 pair once; every API attempt is globally paced at least 45 seconds
        shell: bash
        env:
          OLP_003_KEY_DERIVATION_SECRET: ${{ secrets.OLP_003_KEY_DERIVATION_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          mkdir -p "pair-output/${{ matrix.pair_id }}"
          python "$EXEC_ROOT/execute_pair.py" \
            --pair-id "${{ matrix.pair_id }}" \
            --manifest private/public-assignment/blinded_run_manifest.json \
            --sealed-condition-zip private/sealed/SEALED_CONDITION_BUNDLE.zip \
            --key-derivation-secret-env OLP_003_KEY_DERIVATION_SECRET \
            --key-context "${GITHUB_REPOSITORY}@${GITHUB_SHA}#${GITHUB_RUN_ID}" \
            --out-dir "pair-output/${{ matrix.pair_id }}"
      - name: Upload public 003 pair output or infrastructure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-public-${{ matrix.pair_id }}
          path: pair-output/${{ matrix.pair_id }}/
          if-no-files-found: error
          retention-days: 90

  collect-public:
    needs: [pre_run_003, assign-once, execute-pairs]
    if: always() && needs.assign-once.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Prepare pair collection directory
        run: mkdir -p collected/pairs
      - name: Download every available public pair artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: olp-30pair-003-public-*
          path: collected/pairs
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-assignment-lock
          path: collected/assignment
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-sealed-condition-material
          path: collected/sealed
      - name: Build blind public 003 bundle including infrastructure receipts
        shell: bash
        run: |
          set -euo pipefail
          RM_SHA=$(sha256sum "$EXEC_ROOT/RUNNER_MANIFEST.json" | awk '{print $1}')
          python "$EXEC_ROOT/collect_execution.py" \
            --pair-artifacts collected/pairs \
            --blinded-manifest collected/assignment/blinded_run_manifest.json \
            --assignment-lock collected/assignment/ASSIGNMENT_LOCK.json \
            --sealed-condition-zip collected/sealed/SEALED_CONDITION_BUNDLE.zip \
            --out-dir collected/public-final \
            --runner-manifest-sha256 "$RM_SHA" \
            --preflight-pass-sha256 "${{ needs.pre_run_003.outputs.preflight_sha256 }}"
      - name: Upload PUBLIC 003 scorer bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-PUBLIC-SCORER-EXECUTION-BUNDLE
          path: collected/public-final/
          if-no-files-found: error
          retention-days: 90

  blind-score-and-capstone-gate:
    needs: [assign-once, collect-public]
    if: always() && needs.assign-once.result == 'success' && needs.collect-public.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ready_for_unblind: ${{ steps.gate.outputs.ready_for_unblind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-PUBLIC-SCORER-EXECUTION-BUNDLE
          path: capstone/public
      - name: Seal all blind scores or a publishable blind infrastructure disposition
        run: python "$EXEC_ROOT/blind_score.py" --public-dir capstone/public --out-dir capstone/blind
      - name: Export one-time unblind gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          READY=$(python - <<'PY'
          import json
          print(str(json.load(open('capstone/blind/CAPSTONE_GATE.json'))['ready_for_unblind']).lower())
          PY
          )
          echo "ready_for_unblind=$READY" >> "$GITHUB_OUTPUT"
      - name: Persist blind score/disposition before any key access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-BLIND-CAPSTONE-GATE
          path: capstone/blind/
          if-no-files-found: error
          retention-days: 90

  independently-verify-blind-scores:
    needs: [blind-score-and-capstone-gate]
    if: needs.blind-score-and-capstone-gate.outputs.ready_for_unblind == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-PUBLIC-SCORER-EXECUTION-BUNDLE
          path: capstone/public
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-BLIND-CAPSTONE-GATE
          path: capstone/blind
      - name: Independently recompute all 60 blind score records
        run: python "$EXEC_ROOT/independent_verify_scores.py" --public-dir capstone/public --blind-dir capstone/blind --out capstone/verification/INDEPENDENT_BLIND_SCORE_VERIFICATION.json
      - uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-INDEPENDENT-BLIND-SCORE-VERIFICATION
          path: capstone/verification/
          if-no-files-found: error
          retention-days: 90

  unblind-once-and-publish:
    needs: [assign-once, blind-score-and-capstone-gate, independently-verify-blind-scores]
    if: needs.blind-score-and-capstone-gate.outputs.ready_for_unblind == 'true' && needs.independently-verify-blind-scores.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-BLIND-CAPSTONE-GATE
          path: capstone/blind
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-INDEPENDENT-BLIND-SCORE-VERIFICATION
          path: capstone/verification
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-assignment-lock
          path: capstone/assignment
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-sealed-condition-material
          path: capstone/sealed
      - name: Open condition map once and seal publish-regardless result
        env:
          OLP_003_KEY_DERIVATION_SECRET: ${{ secrets.OLP_003_KEY_DERIVATION_SECRET }}
        run: |
          set -euo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          python "$EXEC_ROOT/unblind_publish.py" \
            --blind-dir capstone/blind \
            --verification-dir capstone/verification \
            --sealed-condition-zip capstone/sealed/SEALED_CONDITION_BUNDLE.zip \
            --key-derivation-secret-env OLP_003_KEY_DERIVATION_SECRET \
            --key-context "${GITHUB_REPOSITORY}@${GITHUB_SHA}#${GITHUB_RUN_ID}" \
            --assignment-lock capstone/assignment/ASSIGNMENT_LOCK.json \
            --out-dir capstone/final
      - name: Upload final capstone publication result
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-FINAL-CAPSTONE-RESULT
          path: capstone/final/
          if-no-files-found: error
          retention-days: 90

  publish-blind-infrastructure-capstone:
    needs: [blind-score-and-capstone-gate]
    if: needs.blind-score-and-capstone-gate.outputs.ready_for_unblind == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: olp-30pair-003-BLIND-CAPSTONE-GATE
          path: capstone/blind
      - name: Upload final publish-regardless infrastructure disposition
        uses: actions/upload-artifact@v4
        with:
          name: olp-30pair-003-FINAL-CAPSTONE-RESULT
          path: |
            capstone/blind/FINAL_BENCHMARK_RESULT.json
            capstone/blind/FINAL_BENCHMARK_RESULT.json.sha256
            capstone/blind/CAPSTONE_GATE.json
            capstone/blind/CAPSTONE_GATE.json.sha256
          if-no-files-found: error
          retention-days: 90

