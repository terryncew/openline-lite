[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openline-lite"
version = "0.3.1"
description = "Verified, bounded AI-agent handoffs with measured prompt-token break-even."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Terrynce White"}]
keywords = ["ai-agents", "evidence", "receipts", "handoff", "audit", "ed25519"]
dependencies = ["cryptography>=42,<48"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
benchmark = ["tiktoken>=0.8,<1"]
dev = ["build==1.3.0", "ruff==0.15.2", "tiktoken==0.12.0"]

[project.urls]
Homepage = "https://github.com/terryncew/openline-lite"
Issues = "https://github.com/terryncew/openline-lite/issues"
Changelog = "https://github.com/terryncew/openline-lite/blob/main/CHANGELOG.md"

[project.scripts]
olp-lite = "openline_lite.cli:main"

[tool.setuptools]
packages = ["openline_lite", "openline_lite.schemas"]

[tool.setuptools.package-data]
openline_lite = ["schemas/*.json", "py.typed"]

[tool.ruff]
target-version = "py310"
